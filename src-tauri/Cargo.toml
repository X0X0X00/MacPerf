[package]
name = "macperf"
version = "0.1.0"
description = "Mac performance analyzer for iStatistica Pro CSV exports"
authors = ["zzh"]
edition = "2021"

[lib]
name = "macperf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
notify = "6"
notify-debouncer-mini = "0.4"
anyhow = "1"
thiserror = "1"
once_cell = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
